name: Build

on:
  push:
    # Feature milestones are checked through PRs. Avoid a second full platform
    # build for the same feature push; integration and vanilla pushes still run.
    branches:
      - develop
      - ttyd64/main
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      build-name:
        description: The name CMake gives this version
        value: ${{ jobs.build-linux.outputs.build-name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    outputs:
      build-name: ${{ steps.build-name.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # CMakeLists.txt runs `git describe --tags` for the build stamp.
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 git cmake ninja-build lsb-release file \
            libsdl2-dev libsdl2-net-dev libpng-dev libzip-dev zipcmp zipmerge ziptool \
            nlohmann-json3-dev libtinyxml2-dev libspdlog-dev libfmt-dev libboost-dev \
            libopengl-dev libgl1-mesa-dev libogg-dev libvorbis-dev zlib1g-dev libbz2-dev \
            libvulkan-dev libshaderc-dev glslang-dev spirv-tools

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux-ccache-${{ github.ref }}
          restore-keys: |
            linux-ccache-

      - name: Cache third-party source builds
        uses: actions/cache@v6
        with:
          key: linux-thirdparty-sdl2.30.3-tinyxml2.10.0.0-libzip1.10.1
          path: |
            SDL2-2.30.3
            tinyxml2-10.0.0
            libzip-1.10.1

      # Ubuntu's SDL2/tinyxml2/libzip are older than libultraship expects, so
      # build the versions the other HarbourMasters ports use.
      - name: Install latest SDL
        run: |
          if [ ! -d "SDL2-2.30.3" ]; then
            wget -q https://www.libsdl.org/release/SDL2-2.30.3.tar.gz
            tar -xzf SDL2-2.30.3.tar.gz
            (cd SDL2-2.30.3 && ./configure --enable-hidapi-libusb && make -j$(nproc))
          fi
          sudo make -C SDL2-2.30.3 install
          sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/

      - name: Install latest tinyxml2
        run: |
          if [ ! -d "tinyxml2-10.0.0" ]; then
            wget -q -O tinyxml2-10.0.0.tar.gz https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
            tar -xzf tinyxml2-10.0.0.tar.gz
            cmake -S tinyxml2-10.0.0 -B tinyxml2-10.0.0/build
            cmake --build tinyxml2-10.0.0/build -j$(nproc)
          fi
          sudo cmake --install tinyxml2-10.0.0/build

      - name: Install libzip without crypto
        run: |
          if [ ! -d "libzip-1.10.1" ]; then
            wget -q https://github.com/nih-at/libzip/releases/download/v1.10.1/libzip-1.10.1.tar.gz
            tar -xzf libzip-1.10.1.tar.gz
            cmake -S libzip-1.10.1 -B libzip-1.10.1/build \
              -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF -DENABLE_OPENSSL=OFF
            cmake --build libzip-1.10.1/build -j$(nproc)
          fi
          sudo cmake --install libzip-1.10.1/build
          sudo cp -av /usr/local/lib/libzip* /lib/x86_64-linux-gnu/
          sudo ldconfig

      - uses: root-project/gcc-problem-matcher-improved@v0.0.1-alpha.1

      - name: Build
        run: |
          cmake --preset ninja-release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/ninja-release --parallel $(nproc)

      - name: ROM-free gameplay tests
        run: ctest --test-dir build/ninja-release --output-on-failure -R ttyd64_gameplay_logic --no-tests=error

      - name: ROM-free playtest process and save isolation checks
        run: |
          cp tools/porting/fixtures/keyboard.json build/ninja-release/playtest-keyboard.json
          python3 tools/porting/check_playtest_preflight.py --executable build/ninja-release/Paperboat --package build/ninja-release --output playtest-preflight-linux.json

      - name: Upload playtest process evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playtest-preflight-linux
          path: playtest-preflight-linux.json

      - name: Read build name
        id: build-name
        run: echo "name=$(sed -n 's/^PROJECT_BUILD_NAME:STRING=//p' build/ninja-release/CMakeCache.txt)" >> "$GITHUB_OUTPUT"

      - name: Create AppImage
        run: |
          # No FUSE on the runners, so every AppImage we invoke has to self-extract.
          export APPIMAGE_EXTRACT_AND_RUN=1
          cd build/ninja-release
          cpack -G External

      - name: Create package
        run: |
          mkdir Paperboat-linux
          mv build/ninja-release/*.AppImage Paperboat-linux/Paperboat.AppImage
          cp README.md Paperboat-linux/readme.txt
          wget -q -O Paperboat-linux/gamecontrollerdb.txt https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/master/gamecontrollerdb.txt

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Paperboat-linux
          path: Paperboat-linux

  build-windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          key: windows-vcpkg-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            windows-vcpkg-
          path: |
            ~/AppData/Local/vcpkg/archives

      - name: Cache Vulkan SDK
        uses: actions/cache@v6
        with:
          key: windows-vulkan-sdk-v1
          path: C:\VulkanSDK

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\VulkanSDK\Lib")) {
            $url = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe"
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\vulkan_sdk.exe"
            $p = Start-Process -FilePath "$env:RUNNER_TEMP\vulkan_sdk.exe" `
              -ArgumentList "--root","C:\VulkanSDK","--accept-licenses","--default-answer","--confirm-command","install" `
              -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Vulkan SDK install failed with exit code $($p.ExitCode)" }
          }
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Mirrors generate-vs-solution.bat: VS 2022 + ClangCL, x64, static triplet.
      - name: Build
        run: |
          cmake -S . -B build/x64 -G "Visual Studio 17 2022" -T ClangCL -A x64 -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build build/x64 --config Release --target Paperboat --parallel

      - name: Create package
        run: |
          mkdir Paperboat-windows
          mkdir Paperboat-windows/debug
          Move-Item build/x64/Release/Paperboat.exe Paperboat-windows/
          Move-Item build/x64/Release/paperboat.o2r Paperboat-windows/
          Move-Item build/x64/Release/config.yml Paperboat-windows/
          Move-Item build/x64/Release/assets Paperboat-windows/
          Get-ChildItem build/x64/Release/*.pdb | Move-Item -Destination Paperboat-windows/debug/
          Copy-Item README.md Paperboat-windows/readme.txt
          Copy-Item tools/porting/Play-TTYD64.ps1 Paperboat-windows/
          Copy-Item tools/porting/Play-TTYD64.cmd Paperboat-windows/
          Copy-Item tools/porting/WINDOWS-PLAYTEST.md Paperboat-windows/PLAYTEST.txt
          Copy-Item tools/porting/fixtures/keyboard.json Paperboat-windows/playtest-keyboard.json
          $shaderc = Get-ChildItem "$env:VULKAN_SDK/Bin/shaderc_shared.dll" -ErrorAction SilentlyContinue
          if (-not $shaderc) { throw "shaderc_shared.dll not found in the Vulkan SDK; the Vulkan backend would not start" }
          Copy-Item $shaderc.FullName Paperboat-windows/
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/master/gamecontrollerdb.txt" -OutFile "Paperboat-windows/gamecontrollerdb.txt"

      - name: ROM-free packaged Windows process and save isolation checks
        run: |
          python tools/porting/check_playtest_preflight.py --executable Paperboat-windows/Paperboat.exe --package Paperboat-windows --output playtest-preflight-windows.json

      - name: Upload playtest process evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playtest-preflight-windows
          path: playtest-preflight-windows.json

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Paperboat-windows
          path: Paperboat-windows

  build-macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        uses: melusina-org/setup-macports@v1
        with:
          parameters: '.github/macports.yml'

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: macos-ccache-${{ github.ref }}
          restore-keys: |
            macos-ccache-

      - name: Build
        run: |
          # MacPorts puts the Vulkan loader, MoltenVK and shaderc under
          # /opt/local, which CMake's FindVulkan does not search on its own.
          export VULKAN_SDK=/opt/local
          cmake --preset ninja-release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/ninja-release --parallel $(sysctl -n hw.logicalcpu)

      - name: Create package
        run: |
          (cd build/ninja-release && cpack)
          mkdir Paperboat-mac
          mv _packages/*.dmg Paperboat-mac/Paperboat.dmg
          cp README.md Paperboat-mac/readme.txt

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Paperboat-mac
          path: Paperboat-mac
